<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – Forensic 3D</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0d1117;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e6edf3;
  }
  .card {
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 12px;
    padding: 40px 36px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
  }
  .logo { text-align: center; margin-bottom: 28px; }
  .logo h1 { font-size: 1.8rem; color: #3b82f6; letter-spacing: 2px; }
  .logo p  { font-size: .8rem; color: #8b949e; margin-top: 4px; }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: .82rem; color: #8b949e; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
  input[type=text], input[type=password] {
    width: 100%;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 10px 14px;
    color: #e6edf3;
    font-size: .95rem;
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: #3b82f6; }
  .btn {
    width: 100%;
    background: #3b82f6;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background .2s;
  }
  .btn:hover { background: #2563eb; }
  .error {
    background: rgba(239,68,68,.1);
    border: 1px solid #ef4444;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: .88rem;
    color: #ef4444;
    margin-bottom: 16px;
  }
  .footer { text-align: center; margin-top: 20px; font-size: .85rem; color: #8b949e; }
  .footer a { color: #3b82f6; text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
  .divider { border: none; border-top: 1px solid #21262d; margin: 20px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>FORENSIC 3D</h1>
    <p>Detection &amp; Analysis Platform</p>
  </div>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  {% if messages %}
    {% for message in messages %}
      <div class="error" style="border-color:#22c55e;color:#22c55e;background:rgba(34,197,94,.1);">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">Sign In</button>
  </form>

  <hr class="divider">
  <div class="footer">
    Don't have an account? <a href="{% url 'register' %}">Request Access</a>
  </div>
</div>
</body>
</html>
