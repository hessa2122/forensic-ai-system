<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Evidence - {{ case.case_number }}</title>
<style>
  :root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#3b82f6;--green:#22c55e}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,system-ui,sans-serif;min-height:100vh}
  .nav{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(22,27,34,.96);border-bottom:1px solid #21262d;position:sticky;top:0}
  .brand{font-weight:800;letter-spacing:.2px}.brand span{color:var(--accent)} .nav a{color:#93c5fd;text-decoration:none;font-size:13px}
  .wrap{max-width:980px;margin:0 auto;padding:30px 20px}
  .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
  h1{font-size:28px;margin:0 0 6px}.sub{color:var(--muted);font-size:14px}
  .panel{background:var(--surface);border:1px solid #21262d;border-radius:8px;padding:22px}
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:8px}
  input[type=file],textarea{width:100%;background:#0b1220;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:14px}
  textarea{min-height:90px;resize:vertical}.field{margin-bottom:18px}
  .drop{border:2px dashed var(--border);border-radius:8px;padding:34px;text-align:center;background:rgba(59,130,246,.04);margin-bottom:18px}
  .drop strong{display:block;font-size:18px;margin-bottom:6px}.drop span{color:var(--muted);font-size:13px}
  .actions{display:flex;justify-content:flex-end;gap:10px}.btn{border:0;border-radius:7px;padding:11px 18px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
  .primary{background:var(--accent);color:white}.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
  .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.stat{background:var(--surface2);border:1px solid #21262d;border-radius:8px;padding:14px}.stat b{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.stat span{font-weight:800}
  @media(max-width:720px){.hero,.actions{flex-direction:column;align-items:stretch}.meta{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="nav">
  <div class="brand">Forensic<span>AI</span></div>
  <a href="{% url 'evidence_list' case.id %}">Back to Evidence</a>
</nav>
<main class="wrap">
  <section class="hero">
    <div>
      <h1>Upload Evidence</h1>
      <div class="sub">Attach crime-scene imagery for Roboflow and local model analysis.</div>
    </div>
  </section>
  <div class="meta">
    <div class="stat"><b>Case</b><span>{{ case.case_number }}</span></div>
    <div class="stat"><b>Priority</b><span>{{ case.priority|title }}</span></div>
    <div class="stat"><b>Status</b><span>{{ case.status|title }}</span></div>
  </div>
  <form class="panel" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="drop">
      <strong>Select Evidence Images</strong>
      <span>JPG, PNG, WEBP, or BMP files are supported.</span>
    </div>
    <div class="field">
      <label for="evidence_files">Evidence Files</label>
      <input id="evidence_files" name="evidence_files" type="file" accept="image/*" multiple required>
    </div>
    <div class="field">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" placeholder="Collection location, chain-of-custody notes, or analyst comments"></textarea>
    </div>
    <div class="actions">
      <a class="btn ghost" href="{% url 'evidence_list' case.id %}">Cancel</a>
      <button class="btn primary" type="submit">Run Analysis</button>
    </div>
  </form>
</main>
</body>
</html>
