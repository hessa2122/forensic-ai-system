<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Submitted | Forensic AI System</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(circle at 20% 20%, rgba(14,165,233,0.22), transparent 30%),
      radial-gradient(circle at 80% 80%, rgba(37,99,235,0.22), transparent 30%),
      linear-gradient(135deg, #020617, #07111f 45%, #020617);
    color: #e5edf8;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 42px 42px;
    pointer-events: none;
  }

  .success-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(148, 163, 184, 0.16);
    border-radius: 28px;
    padding: 44px 38px;
    text-align: center;
    box-shadow: 0 30px 90px rgba(0,0,0,0.55);
    backdrop-filter: blur(18px);
  }

  .success-icon {
    width: 86px;
    height: 86px;
    margin: 0 auto 22px;
    border-radius: 26px;
    background: linear-gradient(135deg, rgba(34,197,94,0.20), rgba(14,165,233,0.18));
    border: 1px solid rgba(34,197,94,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    box-shadow: 0 0 38px rgba(34,197,94,0.22);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 13px;
    border-radius: 999px;
    background: rgba(34,211,238,0.10);
    border: 1px solid rgba(34,211,238,0.26);
    color: #67e8f9;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 18px;
  }

  h2 {
    color: #f8fafc;
    font-size: 30px;
    margin-bottom: 12px;
  }

  h2 span {
    color: #86efac;
  }

  p {
    color: #9fb3ce;
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 24px;
  }

  strong {
    color: #38bdf8;
  }

  .info-box {
    background: rgba(14,165,233,0.08);
    border: 1px solid rgba(56,189,248,0.22);
    border-radius: 16px;
    padding: 15px;
    color: #93c5fd;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 24px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    border-radius: 14px;
    padding: 14px 18px;
    background: linear-gradient(135deg, #0ea5e9, #2563eb);
    color: #ffffff;
    font-size: 15px;
    font-weight: 800;
    text-decoration: none;
    box-shadow: 0 14px 30px rgba(37,99,235,0.32);
    transition: 0.25s;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 40px rgba(37,99,235,0.45);
  }

  .footer-note {
    margin-top: 18px;
    color: #64748b;
    font-size: 12px;
  }
</style>
</head>

<body>

<div class="success-card">

  <div class="badge">● Access Request Received</div>

  <div class="success-icon">✅</div>

  <h2>Request <span>Submitted</span></h2>

  <p>
    Your account request for <strong>{{ username }}</strong> has been submitted successfully.
  </p>

  <div class="info-box">
    A system administrator will review and approve your account.
    You can log in only after your account is approved.
  </div>

  <a href="{% url 'login' %}" class="btn">
    ← Back to Login
  </a>

  <div class="footer-note">
    Forensic AI System · Secure Access Control
  </div>

</div>

</body>
</html>
